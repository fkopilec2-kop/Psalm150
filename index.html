<!DOCTYPE html>

    <div class="drawer-group">
      <div class="drawer-label">Разделы</div>
      <a class="drawer-link" href="index.html"><span>Главная</span><span>→</span></a>
      <a class="drawer-link" href="library.html"><span>Библиотека</span><span>→</span></a>

      <a class="drawer-link" href="order.html"><span>Заказать</span><span>→</span></a>
    </div>
    <div class="drawer-group">
      <div class="drawer-label">Выпуски</div>
      <a class="drawer-link" href="issue-4.html"><span>Выпуск №4</span><span>#4</span></a>
      <a class="drawer-link" href="issue-3.html"><span>Выпуск №3</span><span>#3</span></a>
      <a class="drawer-link" href="issue-2.html"><span>Выпуск №2</span><span>#2</span></a>
      <a class="drawer-link" href="issue-1.html"><span>Выпуск №1</span><span>#1</span></a>
    </div>
  </aside>

  <div class="container">
    <header>
      <a href="index.html" class="brand">Псалом 150</a>
      <div class="header-right">
        <div class="top-links">
          <a href="index.html">Главная</a>
          <a href="library.html">Библиотека</a>
          <a href="order.html">Заказать</a>
        </div>
        <button id="openDrawerBtn" type="button" class="menu-btn" aria-label="Открыть меню">☰</button>
      </div>
    </header>

    <section aria-label="Последние выпуски">
      <div id="homeLatestIssues" class="issues-grid"></div>
    </section>

    <section class="order-banner" aria-label="Заказать выпуск">
      <a class="order-banner-link" href="order.html">
        <span>Заказать журнал</span>
        <span>→</span>
      </a>
    </section>

   <footer class="social-bar" aria-label="Соцсети и контакты">

        <svg class="social-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M20.8 4.2L3.1 11.1C1.9 11.6 1.9 12.3 2.9 12.6L7.4 14L17.9 7.4C18.4 7.1 18.8 7.3 18.5 7.6L10 15.3L9.7 20.1C10.2 20.1 10.4 19.9 10.7 19.6L12.9 17.5L17.5 20.9C18.3 21.3 18.9 21.1 19.1 20.1L22.1 5.9C22.4 4.7 21.7 3.9 20.8 4.2Z" fill="currentColor" />

      <a class="social-icon-btn" href="#support" aria-label="Поддержка (скоро)" title="Поддержка (заглушка)">

          <path d="M12 20.2C12 20.2 3.5 14.7 3.5 8.8C3.5 6.3 5.5 4.4 7.9 4.4C9.5 4.4 11 5.2 12 6.5C13 5.2 14.5 4.4 16.1 4.4C18.5 4.4 20.5 6.3 20.5 8.8C20.5 14.7 12 20.2 12 20.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
      </a>
    </footer>
  </div>

  <!-- Полноэкранный просмотрщик страниц выпуска -->
  <div id="issueViewerModal" class="issue-viewer" aria-hidden="true">
    <div class="issue-viewer-hover-zone" aria-hidden="true"></div>
    <div class="issue-viewer-topbar">
      <div class="issue-viewer-title-wrap">
        <strong id="issueViewerTitle">Выпуск</strong>
        <span id="issueViewerPageInfo" class="issue-viewer-page-info"></span>
      </div>
      <div class="issue-viewer-controls">
        <button id="issuePrevPageBtn" type="button" class="viewer-btn">← Назад</button>
        <button id="issueNextPageBtn" type="button" class="viewer-btn">Вперёд →</button>
        <button id="issueSpreadToggleBtn" type="button" class="viewer-btn">Разворот</button>
        <button id="issueFullscreenBtn" type="button" class="viewer-btn" title="На весь экран">⛶</button>
        <button id="issueCloseViewerBtn" type="button" class="viewer-btn viewer-close-btn">✕ Закрыть</button>
      </div>
    </div>
    <div id="issueViewerStage" class="issue-viewer-stage">
      <img id="issuePageImage" class="issue-page-image" alt="" />
      <div id="issueViewerStatus" class="issue-viewer-status"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
