<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Выпуск №4 — Псалом 150</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <aside id="sideDrawer" class="drawer" aria-label="Меню навигации" aria-hidden="true">
    <div class="drawer-top">
      <span class="drawer-title">Псалом 150</span>
      <button id="closeDrawerBtn" type="button" class="drawer-close">Закрыть</button>
    </div>
    <div class="drawer-group">
      <div class="drawer-label">Разделы</div>
      <a class="drawer-link" href="index.html"><span>Главная</span><span>→</span></a>
      <a class="drawer-link" href="library.html"><span>Библиотека</span><span>→</span></a>
      <a class="drawer-link" href="library.html#authors-block"><span>Авторы</span><span>→</span></a>
      <a class="drawer-link" href="order.html"><span>Заказать</span><span>→</span></a>
    </div>
    <div class="drawer-group">
      <div class="drawer-label">Выпуски</div>
      <a class="drawer-link" href="issue-4.html"><span>Выпуск №4</span><span>#4</span></a>
      <a class="drawer-link" href="issue-3.html"><span>Выпуск №3</span><span>#3</span></a>
      <a class="drawer-link" href="issue-2.html"><span>Выпуск №2</span><span>#2</span></a>
      <a class="drawer-link" href="issue-1.html"><span>Выпуск №1</span><span>#1</span></a>
    </div>
  </aside>

  <div class="container">
    <header>
      <a href="index.html" class="brand">Псалом 150</a>
      <div class="header-right">
        <div class="top-links">
          <a href="index.html">Главная</a>
          <a href="library.html">Библиотека</a>
          <a href="order.html">Заказать</a>
        </div>
        <button id="openDrawerBtn" type="button" class="menu-btn" aria-label="Открыть меню">☰</button>
      </div>
    </header>

    <section class="order-panel" aria-label="Информация о выпуске">
      <div class="form-grid" style="align-items: center; margin-bottom: 0;">
        <div>
          <h1 id="issuePageTitle" style="margin-bottom: 8px;">Выпуск №4</h1>
          <p id="issuePageSubtitle" class="muted" style="margin: 0 0 16px;"></p>
          <div class="entry-actions">
            <button id="openFullIssueBtn" type="button" class="btn">Читать выпуск целиком</button>
            <a id="issuePdfLink" class="btn btn-secondary" href="psalm-150-issue-4.pdf" download>Скачать PDF</a>
            <a class="btn btn-secondary" href="order.html">Заказать выпуск</a>
          </div>
        </div>
        <div class="issue-cover-wrap" style="max-width: 240px; margin: 0 auto 0 0;">
          <img id="issuePageCover" class="issue-cover-img" src="" alt="" />
        </div>
      </div>
    </section>

    <h2>Материалы выпуска</h2>

    <section class="filter-panel" aria-label="Фильтр материалов выпуска">
      <div class="filter-grid">
        <div>
          <label for="issueRubricSelect">Рубрика</label>
          <select id="issueRubricSelect">
            <option value="">Все рубрики выпуска</option>
          </select>
        </div>
        <div>
          <label for="issueSearchInput">Поиск по выпуску</label>
          <input id="issueSearchInput" type="search" placeholder="Название, автор или текст..." />
        </div>
      </div>
    </section>

    <section style="margin-top: 18px;" aria-label="Карточки материалов выпуска">
      <div id="issueEntriesList" class="entries-list"></div>
    </section>

    <footer class="social-bar" aria-label="Соцсети и контакты">
      <a class="social-icon-btn" href="https://www.youtube.com/@Psalm150-DVJS" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">▶</a>
      <a class="social-icon-btn" href="mailto:Psalm150dvjs@gmail.com" aria-label="Почта" title="Почта">✉</a>
      <a class="social-icon-btn" href="https://t.me/Psalm150DSVJ" target="_blank" rel="noopener noreferrer" aria-label="Telegram" title="Telegram">✈</a>
      <a class="social-icon-btn" href="#support" aria-label="Поддержка (скоро)" title="Поддержка (заглушка)">♥</a>
    </footer>
  </div>

  <div id="issueViewerModal" class="issue-viewer" aria-hidden="true">
    <div class="issue-viewer-hover-zone" aria-hidden="true"></div>
    <div class="issue-viewer-topbar">
      <div class="issue-viewer-title-wrap">
        <strong id="issueViewerTitle">Выпуск</strong>
        <span id="issueViewerPageInfo" class="issue-viewer-page-info"></span>
      </div>
      <div class="issue-viewer-controls">
        <button id="issuePrevPageBtn" type="button" class="viewer-btn">← Назад</button>
        <button id="issueNextPageBtn" type="button" class="viewer-btn">Вперёд →</button>
        <button id="issueSpreadToggleBtn" type="button" class="viewer-btn">Разворот</button>
        <button id="issueFullscreenBtn" type="button" class="viewer-btn" title="На весь экран">⛶</button>
        <button id="issueCloseViewerBtn" type="button" class="viewer-btn viewer-close-btn">✕ Закрыть</button>
      </div>
    </div>
    <div id="issueViewerStage" class="issue-viewer-stage">
      <img id="issuePageImage" class="issue-page-image" alt="" />
      <div id="issueViewerStatus" class="issue-viewer-status"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>initIssuePage(4);</script>
</body>
</html>
